databases:
  - name: worldcup-postgres
    plan: free
    region: oregon
services:
  - type: web
    name: worldcup-backend
    runtime: python
    plan: free
    autoDeployTrigger: off
    healthCheckPath: /ready
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENVIRONMENT
        value: production
      - key: ADMIN_API_KEY
        generateValue: true
      - key: COMPUTE_TIMEOUT_SECONDS
        value: "600"
      - key: ALLOW_DEMO_DATA
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: worldcup-postgres
          property: connectionString
  - type: web
    name: worldcup-frontend
    runtime: python
    plan: free
    autoDeployTrigger: off
    healthCheckPath: /_stcore/health
    buildCommand: pip install -r requirements-dashboard.txt
    startCommand: python -m streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: PYTHONPATH
        value: .
      - key: BACKEND_URL
        sync: false
